services:
  content-control:
    image: koreokorp-control:20261024
    container_name: koreokorp-control
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (r.status !== 200 || (await r.json()).ok !== true) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      ADMIN_ORIGIN: https://adctrl.koreokorp.com
      PUBLIC_ORIGIN: https://koreokorp.com
    volumes:
      - /var/lib/koreokorp-content:/data
    networks:
      - edge
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  edge:
    external: true
